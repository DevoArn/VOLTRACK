name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

# One run per ref; superseded PR runs are cancelled, main/tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default — jobs opt in to more.
permissions:
  contents: read

env:
  LOCAL_IMAGE: voltrack:ci
  IMAGE_TAR: /tmp/voltrack-image.tar

jobs:
  # ───────────────────────────────────────────────────────────── quality gates
  quality:
    name: Lint · format · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

  # ──────────────────────────────────────────────────────── unit + DSP tests
  test:
    name: Unit + DSP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          # shellcheck disable=SC2016 # single quotes on purpose: ${...} below is a JS template literal
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage", "| Metric | % | Covered |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/unit-junit.xml
          retention-days: 14

  # ─────────────────────────────────────────── container build + smoke test
  image:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.LOCAL_IMAGE }}
          outputs: type=docker,dest=${{ env.IMAGE_TAR }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker load --input "$IMAGE_TAR"
      - name: Smoke test with the Kubernetes hardening (read-only rootfs, non-root, no caps)
        run: |
          docker run -d --name app -p 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            "$LOCAL_IMAGE"
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          test "$(docker exec app id -u)" = "101"
          curl -fsS localhost:8080/version.json | tee version.json
          test "$(jq -r .commit version.json)" = "$GITHUB_SHA"
          curl -fsSI localhost:8080/ | grep -qi '^content-security-policy:'
          for page in / /modular /acid /va; do curl -fsS -o /dev/null "localhost:8080$page"; done
          docker logs app 2>/dev/null | grep -q '"status":200'
      - name: Image report
        if: always()
        run: |
          {
            echo "### Image"
            echo "| | |"
            echo "|---|---|"
            echo "| Size | $(docker image inspect "$LOCAL_IMAGE" --format '{{.Size}}' | numfmt --to=iec) |"
            echo "| User | $(docker image inspect "$LOCAL_IMAGE" --format '{{.Config.User}}') |"
            echo "| Revision | \`$(docker image inspect "$LOCAL_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          docker rm -f app || true
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ env.IMAGE_TAR }}
          retention-days: 1

  # ─────────────────────────────────────────────────────── security scanning
  scan:
    name: Trivy image scan
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp
      - name: Scan → SARIF (GitHub code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ env.IMAGE_TAR }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@v3
        # code scanning is free on public repos; don't fail private ones without GHAS
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Gate — fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ env.IMAGE_TAR }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ──────────────────────────────────────────── browser tests vs container
  e2e:
    name: E2E (Playwright vs container)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp
      - name: Start the production image
        run: |
          docker load --input "$IMAGE_TAR"
          docker run -d --name app -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL "$LOCAL_IMAGE"
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
      - name: Run Playwright
        # localhost is a secure context — required for AudioWorklet
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080/
          E2E_EXPECT_HEADERS: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ──────────────────────────────────────── Kubernetes: lint + real deploy
  helm:
    name: Helm lint + deploy to kind
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deployments/helm/voltrack --strict
      - name: Validate rendered manifests (kubeconform)
        run: |
          helm template voltrack deployments/helm/voltrack \
            --set ingress.enabled=true --set autoscaling.enabled=true --set networkPolicy.enabled=true \
            > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:latest -strict -summary -kubernetes-version 1.31.0 - < rendered.yaml
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp
      - name: Load image into kind
        run: |
          docker load --input "$IMAGE_TAR"
          kind load docker-image "$LOCAL_IMAGE" --name ci
      - name: Deploy chart
        run: |
          helm upgrade --install voltrack deployments/helm/voltrack \
            --namespace voltrack --create-namespace \
            --set image.repository=voltrack --set image.tag=ci --set image.pullPolicy=Never \
            --wait --timeout 3m
      - name: helm test
        run: helm test voltrack --namespace voltrack --logs
      - name: Verify the deployed build
        run: |
          kubectl -n voltrack port-forward svc/voltrack 8080:80 >/dev/null 2>&1 &
          for _ in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          test "$(curl -fsS localhost:8080/version.json | jq -r .commit)" = "$GITHUB_SHA"
          kubectl -n voltrack get deploy,po,svc,pdb
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n voltrack get all,events --sort-by=.lastTimestamp || true
          kubectl -n voltrack describe pods || true
          kubectl -n voltrack logs -l app.kubernetes.io/name=voltrack --tail=200 || true

  # ───────────────────────────────────────────── publish (main + tags only)
  publish:
    name: Publish image to GHCR
    needs: [quality, test, scan, e2e, helm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        name: Build & push (amd64 + arm64, SBOM + provenance)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || '' }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Summary
        # values go through env, never straight into the script (avoids script injection via ref names)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Tags:"
            while IFS= read -r tag; do echo "- \`$tag\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────── live demo on GitHub Pages
  pages:
    name: Deploy live demo (GitHub Pages)
    needs: [quality, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build for the Pages base path
        run: npm run build
        env:
          # "/<repo>/" for project sites, "/" for <user>.github.io
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          APP_GIT_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify the live site serves this commit
        env:
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          for _ in $(seq 1 30); do
            live="$(curl -fsS "${URL}version.json?nocache=$(date +%s)" | jq -r .commit || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live at $URL ($live)"; exit 0; fi
            sleep 10
          done
          echo "::error::$URL is not serving $GITHUB_SHA"
          exit 1

  # ───────────────────────────────── optional: Kubernetes staging (main)
  deploy-staging:
    name: Deploy to staging (Kubernetes)
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.K8S_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: ./.github/actions/helm-deploy
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
          namespace: voltrack-staging
          values-file: deployments/helm/environments/staging.yaml
          image: ${{ needs.publish.outputs.image }}
          digest: ${{ needs.publish.outputs.digest }}

  # ─────────────────── optional: Kubernetes production (tags, manual approval)
  deploy-production:
    name: Deploy to production (Kubernetes)
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.K8S_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add "Required reviewers" to this environment in repo settings for a manual approval gate.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: ./.github/actions/helm-deploy
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
          namespace: voltrack
          values-file: deployments/helm/environments/production.yaml
          image: ${{ needs.publish.outputs.image }}
          digest: ${{ needs.publish.outputs.digest }}

  # ──────────────────────────────────────────────── GitHub Release (tags)
  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package Helm chart at the release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deployments/helm/voltrack --version "$version" --app-version "$version" --destination chart/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" chart/*.tgz \
            --title "VOLTRACK $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Container image: \`$IMAGE:${GITHUB_REF_NAME#v}\` (\`$DIGEST\`)"
