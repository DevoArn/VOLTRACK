# Staging: small and cheap, deployed on every push to main.
replicaCount: 1

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: true

# Enable once you have an ingress controller + DNS (HTTPS is required for Web Audio):
ingress:
  enabled: false
