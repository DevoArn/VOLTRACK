{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voltrack.fullname" . }}
  labels:
    {{- include "voltrack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "voltrack.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
  # Static site: no egress at all
  egress: []
{{- end }}
