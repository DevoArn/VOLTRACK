services:
  voltrack:
    build:
      context: .
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-dev}
    image: voltrack:local
    container_name: voltrack
    ports:
      - '8080:8080'
    # Same hardening the Helm chart applies in Kubernetes
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
